# =========================================================
# APPLICATION
# =========================================================

spring.application.name=drukconnect

# Render automatically provides PORT.
server.port=${PORT:8080}

# Required so the application listens externally inside Render.
server.address=0.0.0.0

server.forward-headers-strategy=framework


# =========================================================
# DATABASE - PRODUCTION
# =========================================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:1}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR


# =========================================================
# FLYWAY
# =========================================================

spring.flyway.enabled=true


# =========================================================
# EMAIL - PRODUCTION
# =========================================================

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


# =========================================================
# AUTH
# =========================================================

app.auth.send-email-otp=${SEND_EMAIL_OTP:true}
app.auth.require-email-otp=${REQUIRE_EMAIL_OTP:true}

app.auth.send-phone-otp=${SEND_PHONE_OTP:false}
app.auth.require-phone-otp=${REQUIRE_PHONE_OTP:false}

app.auth.current-guideline-version=${CURRENT_GUIDELINE_VERSION:1.0}


# =========================================================
# JWT
# =========================================================

app.jwt.issuer=${JWT_ISSUER:drukconnect}

app.jwt.access-ttl=${JWT_ACCESS_TTL:15m}
app.jwt.refresh-ttl=${JWT_REFRESH_TTL:7d}

app.jwt.secret-base64=${JWT_SECRET_BASE64}


# =========================================================
# OTP
# =========================================================

app.otp.ttl=${OTP_TTL:5m}
app.otp.resend-cooldown=${OTP_RESEND_COOLDOWN:60s}
app.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
app.otp.digits=${OTP_DIGITS:4}

app.otp.hmac-secret-base64=${OTP_HMAC_SECRET_BASE64}


# =========================================================
# MAIL
# =========================================================

app.mail.enabled=${MAIL_ENABLED:true}
app.mail.from=${MAIL_FROM}


# =========================================================
# SPRINGDOC / SWAGGER
# =========================================================

springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.path=/v3/api-docs

springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html

springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.doc-expansion=none

springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.persist-authorization=false
springdoc.swagger-ui.filter=true


# =========================================================
# SMS
# =========================================================

app.sms.enabled=${SMS_ENABLED:true}
app.sms.endpoint=${SMS_ENDPOINT:https://textbelt.com/text}
app.sms.api-key=${SMS_API_KEY}
app.sms.sender-id=${SMS_SENDER_ID:DrukConnect}


# =========================================================
# VOUCH
# =========================================================

app.vouch.invitation-url=${VOUCH_INVITATION_URL}
app.vouch.invitation-ttl=${VOUCH_INVITATION_TTL:7d}

app.vouch.backend-url=${BACKEND_URL}
app.vouch.response-token-ttl=${VOUCH_RESPONSE_TOKEN_TTL:7d}


# =========================================================
# STORAGE
# =========================================================

app.storage.listing-images-dir=${LISTING_IMAGES_DIR:/tmp/uploads/listings}


# =========================================================
# FILE UPLOAD
# =========================================================

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB